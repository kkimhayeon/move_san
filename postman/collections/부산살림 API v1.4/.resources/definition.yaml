$kind: collection
description: |-
  2026-10-27 경로 버전 관리 반영. 서비스 API는 /api/v1/...로 통일. 문서 버전 1.4.0은 API 경로 버전 v1과 별개이다. 기존 클라이언트와 호환되지 않는 계약 변경 시 v2 도입을 검토하며, 내부 리팩터링·호환 가능한 버그 수정은 v1을 유지한다. 즐겨찾기는 로그인 토큰으로 사용자를 식별하고 PUT으로 등록, DELETE로 해제한다. 반복 요청도 같은 최종 상태를 유지하며 성공 시 200을 반환한다.

  2026-10-26 구현 피드백 반영 검토본. v1.2를 대체한다. 인증은 Supabase Auth, Flask는 토큰 검증 및 서비스 권한 검사 담당.
  응답은 status(INTEGER), message(STRING), result. HTTP 코드와 status는 일치. 실패 result=null. error.code/x-error-codes는 사용하지 않는다.
  조회/계산/수정/삭제/즐겨찾기 성공 200, 글/댓글/사진 생성 201. 계산 결과 DB 저장 없음.
  금액 단위 만원. 입력은 JSON number, 유한한 0 이상 값, 소수 최대 4자리. multipleOf를 사용하지 않으며 JSON 숫자 원문을 Decimal로 파싱하여 소수 자릿수를 검증한다. 숫자 문자열, boolean, null, NaN, Infinity 금지. 뒤쪽 0을 제거한 수학적 값 기준으로 판단한다.
  계산은 Decimal로 수행하고 중간 반올림 없음. 표시 금액은 Decimal ROUND_HALF_EVEN으로 소수 1자리. 기존 Python round의 ties-to-even 의도를 유지하되 binary float에 의존하지 않음. 1.25→1.2,1.35→1.4,-1.25→-1.2. -0은 0으로 직렬화. API 숫자는 JSON number.
  지도 median_rent는 소수 최대 4자리의 API 원값, 표시는 소수 1자리. 선택 후 busan_rent에 API 원값 전달. 직접 편집한 경우 편집값을 사용.
  지도 데이터 기준/지역 코드/컬처/RAG는 미정. 챗봇은 인증 미확정으로 실행용 paths에서 제외하고 x-pending-apis에 보관. 실제 서버 구현/DB 대조/통계 검증 완료를 의미하지 않음.
  예시 정책/상품/지역/통계/URL은 구조 설명용 가상값이다. 실제 서비스 데이터로 사용하지 않는다.
variables:
  baseUrl: http://localhost:5000
  bearerToken: ""

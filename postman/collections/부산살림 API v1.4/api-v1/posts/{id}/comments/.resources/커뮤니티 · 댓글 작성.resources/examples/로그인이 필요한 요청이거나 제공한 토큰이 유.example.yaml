$kind: http-example
name: 로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.
request:
  url: "{{baseUrl}}/api/v1/posts/:id/comments"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: 2423719b-de04-82cd-98f3-2dc6bb995fd6
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "content": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 401,
        "message": "로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.",
        "result": null
      }
order: 3000

$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/posts/:id/comments"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: 2423719b-de04-82cd-98f3-2dc6bb995fd6
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "content": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 201,
        "message": "댓글 작성에 성공했습니다.",
        "result": {
          "id": "11111111-1111-4111-8111-111111111111",
          "content": "부산 생활 정보를 공유해주세요.",
          "author": {
            "nickname": "부산살림사용자"
          },
          "created_at": "2026-10-26T07:00:00Z",
          "is_author": true
        }
      }
order: 1000

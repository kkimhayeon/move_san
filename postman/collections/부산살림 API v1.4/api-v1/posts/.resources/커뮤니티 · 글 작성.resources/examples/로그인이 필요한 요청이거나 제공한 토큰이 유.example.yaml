$kind: http-example
name: 로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.
request:
  url: "{{baseUrl}}/api/v1/posts"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "string",
        "content": "string",
        "category_code": "string",
        "image_ids": [
          "134e3988-c66f-cdc1-8439-8be4a5a51535",
          "48e70e34-66ac-bcde-549b-a24d0344ce8c"
        ]
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 401,
        "message": "로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.",
        "result": null
      }
order: 3000

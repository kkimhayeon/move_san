$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/posts"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "부산 생활에 대해 궁금해요",
        "content": "부산 생활 정보를 공유해주세요.",
        "category_code": "LOCAL_LIFE",
        "image_ids": [
          "22222222-2222-4222-8222-222222222222"
        ]
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 201,
        "message": "글 작성에 성공했습니다.",
        "result": {
          "id": "11111111-1111-4111-8111-111111111111",
          "title": "부산 생활에 대해 궁금해요",
          "content": "부산 생활 정보를 공유해주세요.",
          "author": {
            "nickname": "부산살림사용자"
          },
          "created_at": "2026-10-26T07:00:00Z",
          "updated_at": "2026-10-26T07:00:00Z",
          "category_code": "LOCAL_LIFE",
          "images": [
            {
              "id": "22222222-2222-4222-8222-222222222222",
              "url": "https://example.supabase.co/storage/v1/object/public/community-images/u/a.jpg"
            }
          ],
          "is_author": true
        }
      }
order: 1000

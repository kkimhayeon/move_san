$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/posts"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "string",
        "content": "string",
        "category_code": "string",
        "image_ids": [
          "134e3988-c66f-cdc1-8439-8be4a5a51535",
          "48e70e34-66ac-bcde-549b-a24d0344ce8c"
        ]
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 201,
        "message": "글 작성에 성공했습니다.",
        "result": {
          "id": "11111111-1111-4111-8111-111111111111",
          "title": "부산 생활에 대해 궁금해요",
          "content": "부산 생활 정보를 공유해주세요.",
          "author": {
            "nickname": "부산살림사용자"
          },
          "created_at": "2026-10-26T07:00:00Z",
          "updated_at": "2026-10-26T07:00:00Z",
          "category_code": "free",
          "images": [
            {
              "id": "11111111-1111-4111-8111-111111111111",
              "url": "https://example.com/resource"
            }
          ],
          "is_author": true
        }
      }
order: 1000

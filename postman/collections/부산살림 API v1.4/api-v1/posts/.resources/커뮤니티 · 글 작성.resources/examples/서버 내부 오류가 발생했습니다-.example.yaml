$kind: http-example
name: 서버 내부 오류가 발생했습니다.
request:
  url: "{{baseUrl}}/api/v1/posts"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "title": "string",
        "content": "string",
        "category_code": "string",
        "image_ids": [
          "134e3988-c66f-cdc1-8439-8be4a5a51535",
          "48e70e34-66ac-bcde-549b-a24d0344ce8c"
        ]
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 500,
        "message": "서버 내부 오류가 발생했습니다.",
        "result": null
      }
order: 4000

$kind: http-request
description: "DB 저장 없음. 서울=서울월급-서울월세-생활비, 부산=부산월급-부산월세-생활비×0.949. 연간값은 반올림 전 월값×12. 최대 차이는 월급/월세/생활비의 절댓값 비교. 공동 최대는 모두 반환(순서 pay,rent,living), 전부 0이면 items=[] 및 금액=0. 지도에서 선택한 중앙값은 busan_rent에 대입 후 동일 API 호출. 반올림으로 표시 항목 합계와 총액이 미세하게 다를 수 있음. 입력은 Decimal로 최대 소수 4자리 검증. 중간 반올림 없이 연간값/최대 차이 선정 후 HALF_EVEN 소수 1자리 반환. 예: 1.25→1.2,1.35→1.4. 최대 차이 값이 표시상 같아도 반올림 전 값으로 선정한다."
url: "{{baseUrl}}/api/v1/comparisons"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "seoul_pay": 300,
      "busan_pay": 250,
      "seoul_rent": 80,
      "busan_rent": 50,
      "living": 100
    }
settings: {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('status 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();

      pm.test('envelope', function () {
        pm.expect(body.status).to.eql(200);
        pm.expect(body.message).to.eql('생활비 계산에 성공했습니다.');
        pm.expect(body.result).to.be.an('object');
      });

      pm.test('명세 예시와 동일', function () {
        const r = body.result;
        pm.expect(r.seoul.monthly_remaining).to.eql(120);
        pm.expect(r.busan.living).to.eql(94.9);
        pm.expect(r.busan.monthly_remaining).to.eql(105.1);
        pm.expect(r.monthly_difference).to.eql(-14.9);
        pm.expect(r.annual_difference).to.eql(-178.8);
        pm.expect(r.largest_difference.items).to.eql(['pay']);
        pm.expect(r.living_ratio).to.eql(0.949);
        pm.expect(r.unit).to.eql('만원');
      });
examples: ./.resources/비교 · 생활비 계산.resources/examples
order: 1000

$kind: http-example
name: 정책 ID가 UUID 형식이 아닙니다.
request:
  url: "{{baseUrl}}/api/v1/policies/:id/favorite"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: 2423719b-de04-82cd-98f3-2dc6bb995fd6
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "정책 ID가 UUID 형식이 아닙니다.",
        "result": null
      }
order: 2000

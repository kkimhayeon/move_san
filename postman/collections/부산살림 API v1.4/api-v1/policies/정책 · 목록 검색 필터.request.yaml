$kind: http-request
description: is_visible=true만. q는 앞뒤 공백 제거 후 정책명 부분일치, 영문 대소문자 무시. 빈 검색어/카테고리 생략은 전체. 검색과 카테고리는 AND. 토큰 없이 조회하면 is_favorite=false. 유효 토큰 제공 시 해당 사용자의 즐겨찾기를 필터 결과 안에서 먼저 정렬한 뒤 페이지 분할. 같은 그룹에서는 이름,id 오름차순. 잘못되거나 만료된 토큰은 401. 빈 결과는 200/items=[]. favorites_only=true면 본인 즐겨찾기만 반환하며 로그인 필수. 검색/카테고리와 AND. 쿼리 boolean은 true/false만 허용. category는 카테고리 코드이며 응답 category_code와 동일하다. 이 조건은 원래의 즐겨찾기 우선 정렬에 더한 추가 설계안이다.
url: "{{baseUrl}}/api/v1/policies?page=1&page_size=20&category=string&q=string&favorites_only=false"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
  - key: page_size
    value: "20"
    disabled: false
  - key: category
    value: string
    disabled: false
  - key: q
    value: string
    disabled: false
  - key: favorites_only
    value: "false"
    disabled: false
    description: 추가 설계안. true면 본인 즐겨찾기만 조회. 토큰 없으면 401. 기본 false.
auth:
  type: noauth
settings: {}
examples: ./.resources/정책 · 목록 검색 필터.resources/examples
order: 1000

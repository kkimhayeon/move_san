$kind: http-example
name: 제공한 토큰이 잘못되었거나 만료되었습니다. favorites_only=true인데 로그인하지 않은 경우도 같습니다.
request:
  url: "{{baseUrl}}/api/v1/policies?page=1&page_size=20&category=string&q=string&favorites_only=false"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    page: "1"
    page_size: "20"
    category: string
    q: string
    favorites_only: "false"
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 401,
        "message": "제공한 토큰이 잘못되었거나 만료되었습니다. favorites_only=true인데 로그인하지 않은 경우도 같습니다.",
        "result": null
      }
order: 3000

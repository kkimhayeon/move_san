$kind: http-example
name: 페이지 번호 또는 페이지 크기가 허용 범위를 벗어났습니다.
request:
  url: "{{baseUrl}}/api/v1/financial-products?page=1&page_size=20"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    page: "1"
    page_size: "20"
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "페이지 번호 또는 페이지 크기가 허용 범위를 벗어났습니다.",
        "result": null
      }
order: 2000

$kind: http-example
name: 본인이 작성한 댓글만 삭제할 수 있습니다.
request:
  url: "{{baseUrl}}/api/v1/comments/:id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: 2423719b-de04-82cd-98f3-2dc6bb995fd6
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 403,
        "message": "본인이 작성한 댓글만 삭제할 수 있습니다.",
        "result": null
      }
order: 4000

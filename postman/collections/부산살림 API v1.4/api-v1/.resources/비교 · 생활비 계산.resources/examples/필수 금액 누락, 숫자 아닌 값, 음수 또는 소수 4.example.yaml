$kind: http-example
name: 필수 금액 누락, 숫자 아닌 값, 음수 또는 소수 4자리 초과입니다.
request:
  url: "{{baseUrl}}/api/v1/comparisons"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "seoul_pay": 300,
        "busan_pay": 250,
        "seoul_rent": 80,
        "busan_rent": 50,
        "living": 100
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "필수 금액 누락, 숫자 아닌 값, 음수 또는 소수 4자리 초과입니다.",
        "result": null
      }
order: 2000

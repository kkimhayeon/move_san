$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/comparisons"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "seoul_pay": 300,
        "busan_pay": 250,
        "seoul_rent": 80,
        "busan_rent": 50,
        "living": 100
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 200,
        "message": "생활비 계산에 성공했습니다.",
        "result": {
          "input": {
            "seoul_pay": 300,
            "busan_pay": 250,
            "seoul_rent": 80,
            "busan_rent": 50,
            "living": 100
          },
          "seoul": {
            "pay": 300,
            "rent": 80,
            "living": 100,
            "monthly_remaining": 120,
            "annual_remaining": 1440
          },
          "busan": {
            "pay": 250,
            "rent": 50,
            "living": 94.9,
            "monthly_remaining": 105.1,
            "annual_remaining": 1261.2
          },
          "monthly_difference": -14.9,
          "annual_difference": -178.8,
          "differences": [
            {
              "item": "pay",
              "busan_minus_seoul": -50,
              "monthly_remaining_effect": -50
            },
            {
              "item": "rent",
              "busan_minus_seoul": -30,
              "monthly_remaining_effect": 30
            },
            {
              "item": "living",
              "busan_minus_seoul": -5.1,
              "monthly_remaining_effect": 5.1
            }
          ],
          "largest_difference": {
            "items": [
              "pay"
            ],
            "absolute_monthly_difference": 50
          },
          "living_ratio": 0.949,
          "unit": "만원"
        }
      }
order: 1000

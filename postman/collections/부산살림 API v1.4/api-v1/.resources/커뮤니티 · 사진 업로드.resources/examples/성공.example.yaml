$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/uploads/images"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: "(Required) "
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 201,
        "message": "사진 업로드에 성공했습니다.",
        "result": {
          "id": "11111111-1111-4111-8111-111111111111",
          "url": "https://example.com/resource"
        }
      }
order: 1000

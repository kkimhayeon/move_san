$kind: http-example
name: 사진 파일이 최대 크기 5MiB를 초과했습니다.
request:
  url: "{{baseUrl}}/api/v1/uploads/images"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: "(Required) "
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 413,
        "message": "사진 파일이 최대 크기 5MiB를 초과했습니다.",
        "result": null
      }
order: 4000

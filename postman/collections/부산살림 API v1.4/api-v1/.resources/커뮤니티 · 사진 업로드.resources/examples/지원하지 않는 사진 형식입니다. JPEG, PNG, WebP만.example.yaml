$kind: http-example
name: 지원하지 않는 사진 형식입니다. JPEG, PNG, WebP만 허용합니다.
request:
  url: "{{baseUrl}}/api/v1/uploads/images"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: ""
        description: "(Required) "
response:
  statusCode: 415
  statusText: Unsupported Media Type
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 415,
        "message": "지원하지 않는 사진 형식입니다. JPEG, PNG, WebP만 허용합니다.",
        "result": null
      }
order: 5000

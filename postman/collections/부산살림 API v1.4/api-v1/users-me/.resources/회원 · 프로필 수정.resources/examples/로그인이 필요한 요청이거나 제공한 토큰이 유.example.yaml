$kind: http-example
name: 로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "nickname": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 401,
        "message": "로그인이 필요한 요청이거나 제공한 토큰이 유효하지 않습니다.",
        "result": null
      }
order: 3000

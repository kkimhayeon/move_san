$kind: http-example
name: 닉네임은 앞뒤 공백 제거 후 1~30자여야 합니다.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "nickname": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 400,
        "message": "닉네임은 앞뒤 공백 제거 후 1~30자여야 합니다.",
        "result": null
      }
order: 2000

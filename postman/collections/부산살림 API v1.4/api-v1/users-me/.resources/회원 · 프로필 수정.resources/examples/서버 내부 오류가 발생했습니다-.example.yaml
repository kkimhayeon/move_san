$kind: http-example
name: 서버 내부 오류가 발생했습니다.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "nickname": "string"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 500,
        "message": "서버 내부 오류가 발생했습니다.",
        "result": null
      }
order: 5000

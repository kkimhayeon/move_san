$kind: http-example
name: 회원 프로필이 생성되지 않았습니다.
request:
  url: "{{baseUrl}}/api/v1/users/me"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": 404,
        "message": "회원 프로필이 생성되지 않았습니다.",
        "result": null
      }
order: 3000

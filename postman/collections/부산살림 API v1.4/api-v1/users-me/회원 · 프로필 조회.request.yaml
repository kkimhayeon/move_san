$kind: http-request
description: Supabase Auth access token 검증 후 sub와 동일한 id의 profiles 조회. 프로필 생성은 Supabase 신규 auth.users 생성 시 DB 트리거로 처리하는 설계안. 닉네임은 회원가입 metadata에서 초기화하고 이 API의 PATCH로 수정. metadata는 권한 판단에 사용하지 않는다. 기존 가입자의 프로필은 초기 마이그레이션으로 보완. 프로필 미생성은 404.
url: "{{baseUrl}}/api/v1/users/me"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/회원 · 프로필 조회.resources/examples
order: 1000

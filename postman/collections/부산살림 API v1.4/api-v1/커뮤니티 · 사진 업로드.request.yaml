$kind: http-request
description: "설계 기본안: JPEG/PNG/WebP 한 파일 최대 5MiB, 글당 최대 5장. 실제 파일 형식 검사, EXIF 제거, 임의 파일명, 실행불가 저장. 본인 업로드만 글에 연결. 미연결 파일 정리 정책은 구현 시 설정."
url: "{{baseUrl}}/api/v1/uploads/images"
method: POST
headers:
  Content-Type: multipart/form-data
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: file
      src: ""
      description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/커뮤니티 · 사진 업로드.resources/examples
order: 9000

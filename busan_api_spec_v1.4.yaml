components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Supabase Auth access token. Authorization: Bearer <access_token>.
        Flask는 프로젝트의 서명키로 서명 및 만료, issuer, audience 검증 후 sub를 사용자 ID로 사용. refresh
        token은 Flask 서비스 API로 보내지 않는다.'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - status
      - message
      - result
      properties:
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 413
          - 415
          - 429
          - 500
          - 503
        message:
          type: string
        result:
          type: object
          nullable: true
          enum:
          - null
      example:
        status: 400
        message: 입력값을 확인해주세요.
        result: null
    ComparisonInput:
      type: object
      additionalProperties: false
      required:
      - seoul_pay
      - busan_pay
      - seoul_rent
      - busan_rent
      - living
      properties:
        seoul_pay:
          type: number
          description: 서울 월급 (만원); JSON number, 0 이상, 소수 최대 4자리. Decimal 검증.
          minimum: 0
          x-max-decimal-places: 4
        busan_pay:
          type: number
          description: 부산 월급 (만원); JSON number, 0 이상, 소수 최대 4자리. Decimal 검증.
          minimum: 0
          x-max-decimal-places: 4
        seoul_rent:
          type: number
          description: 서울 월세; 사용자 입력 (만원); JSON number, 0 이상, 소수 최대 4자리. Decimal 검증.
          minimum: 0
          x-max-decimal-places: 4
        busan_rent:
          type: number
          description: 부산 월세; 사용자 입력 (만원); JSON number, 0 이상, 소수 최대 4자리. Decimal 검증.
          minimum: 0
          x-max-decimal-places: 4
        living:
          type: number
          description: 서울 기준 생활비 (만원); JSON number, 0 이상, 소수 최대 4자리. Decimal 검증.
          minimum: 0
          x-max-decimal-places: 4
    CityAmounts:
      type: object
      additionalProperties: false
      required:
      - pay

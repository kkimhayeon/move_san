openapi: 3.0.3
info:
  title: 부산살림 API 구현 명세
  version: 1.4.0-review
  description: '2026-10-27 경로 버전 관리 반영. 서비스 API는 /api/v1/...로 통일. 문서 버전 1.4.0은 API
    경로 버전 v1과 별개이다. 기존 클라이언트와 호환되지 않는 계약 변경 시 v2 도입을 검토하며, 내부 리팩터링·호환 가능한 버그 수정은 v1을
    유지한다. 즐겨찾기는 로그인 토큰으로 사용자를 식별하고 PUT으로 등록, DELETE로 해제한다. 반복 요청도 같은 최종 상태를 유지하며 성공
    시 200을 반환한다.


    2026-10-26 구현 피드백 반영 검토본. v1.2를 대체한다. 인증은 Supabase Auth, Flask는 토큰 검증 및 서비스 권한
    검사 담당.

    응답은 status(INTEGER), message(STRING), result. HTTP 코드와 status는 일치. 실패 result=null.
    error.code/x-error-codes는 사용하지 않는다.

    조회/계산/수정/삭제/즐겨찾기 성공 200, 글/댓글/사진 생성 201. 계산 결과 DB 저장 없음.

    금액 단위 만원. 입력은 JSON number, 유한한 0 이상 값, 소수 최대 4자리. multipleOf를 사용하지 않으며 JSON 숫자
    원문을 Decimal로 파싱하여 소수 자릿수를 검증한다. 숫자 문자열, boolean, null, NaN, Infinity 금지. 뒤쪽 0을
    제거한 수학적 값 기준으로 판단한다.

    계산은 Decimal로 수행하고 중간 반올림 없음. 표시 금액은 Decimal ROUND_HALF_EVEN으로 소수 1자리. 기존 Python
    round의 ties-to-even 의도를 유지하되 binary float에 의존하지 않음. 1.25→1.2,1.35→1.4,-1.25→-1.2.
    -0은 0으로 직렬화. API 숫자는 JSON number.

    지도 median_rent는 소수 최대 4자리의 API 원값, 표시는 소수 1자리. 선택 후 busan_rent에 API 원값 전달. 직접
    편집한 경우 편집값을 사용.

    지도 월세는 보증금 1000만원 환산(adjusted_1000), 2023-09~2026-08, 전용면적 ≤33㎡, 주택유형 단독/다가구·연립다세대·오피스텔.
    구군 중심좌표·출처명·갱신시각은 프로젝트에 검증된 값이 없어 null. 지역 코드/컬처/RAG는 미정.
    챗봇은 인증 미확정으로 실행용 paths에서 제외하고 x-pending-apis에 보관.

    예시 정책/상품/지역/통계/URL은 구조 설명용 가상값이다. 실제 서비스 데이터로 사용하지 않는다.'
servers:
- url: http://localhost:5000
  description: Flask 로컬 개발용 예시; 현재 서버가 실행 중이라는 의미 아님
paths:
  /api/v1/comparisons:
    post:
      tags:
      - 비교
      summary: 비교 · 생활비 계산
      description: 'DB 저장 없음. 서울=서울월급-서울월세-생활비, 부산=부산월급-부산월세-생활비×0.949. 연간값은 반올림 전
        월값×12. 최대 차이는 월급/월세/생활비의 절댓값 비교. 공동 최대는 모두 반환(순서 pay,rent,living), 전부 0이면
        items=[] 및 금액=0. 지도에서 선택한 중앙값은 busan_rent에 대입 후 동일 API 호출. 반올림으로 표시 항목 합계와
        총액이 미세하게 다를 수 있음. 입력은 Decimal로 최대 소수 4자리 검증. 중간 반올림 없이 연간값/최대 차이 선정 후 HALF_EVEN
        소수 1자리 반환. 예: 1.25→1.2,1.35→1.4. 최대 차이 값이 표시상 같아도 반올림 전 값으로 선정한다.'
      operationId: post_api_comparisons
      x-mvp-phase: 1
      x-implementation-status: planned
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/post_api_comparisonsResponse'
              example:
                status: 200
                message: 생활비 계산에 성공했습니다.
                result:
                  input:
                    seoul_pay: 300
                    busan_pay: 250
                    seoul_rent: 80
                    busan_rent: 50
                    living: 100
                  seoul:
                    pay: 300
                    rent: 80
                    living: 100
                    monthly_remaining: 120
                    annual_remaining: 1440
                  busan:
                    pay: 250
                    rent: 50
                    living: 94.9
                    monthly_remaining: 105.1
                    annual_remaining: 1261.2
                  monthly_difference: -14.9
                  annual_difference: -178.8
                  differences:
                  - item: pay
                    busan_minus_seoul: -50
                    monthly_remaining_effect: -50
                  - item: rent
                    busan_minus_seoul: -30
                    monthly_remaining_effect: 30
                  - item: living
                    busan_minus_seoul: -5.1
                    monthly_remaining_effect: 5.1
                  largest_difference:
                    items:
                    - pay
                    absolute_monthly_difference: 50
                  living_ratio: 0.949
                  unit: 만원
        '400':
          description: 필수 금액 누락, 숫자 아닌 값, 음수 또는 소수 4자리 초과입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                message: 필수 금액 누락, 숫자 아닌 값, 음수 또는 소수 4자리 초과입니다.
                result: null
        '500':
          description: 서버 내부 오류가 발생했습니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 500
                message: 서버 내부 오류가 발생했습니다.
                result: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonInput'
            example:
              seoul_pay: 300
              busan_pay: 250
              seoul_rent: 80
              busan_rent: 50
              living: 100
      x-api-id: CALC-001
  /api/v1/policies:
    get:
      tags:
      - 정책
      summary: 정책 · 목록 검색 필터

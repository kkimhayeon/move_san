x-auth-flow:
  provider: Supabase Auth
  frontend: 프론트 회원가입/로그인 UI에서 Supabase Auth SDK 호출. 세션 유지/토큰 갱신/로그아웃은 Auth SDK 담당.
    별도 Flask /auth/login 또는 /auth/register 없음.
  flask: 회원 전용 요청의 access token 검증 후 sub를 사용한다. user_id/author_id를 클라이언트 입력으로 신뢰하지
    않는다.
  authorization: 즐겨찾기는 본인 계정, 글/댓글 삭제는 작성자, 사진 연결은 업로드 소유자 확인. 서버 privileged DB 접속
    시에도 소유권 검사는 필수.
  database: profiles.id는 auth.users.id 참조. favorites는 (user_id,policy_id) 유일 제약. 게시글/댓글/업로드에
    소유자 FK. 브라우저가 직접 접근하는 DB/Storage에는 사용자별 접근 정책 적용.
  secrets: 서버 전용 비밀키는 브라우저에 노출하지 않는다.
  ui: 조회와 계산은 공개. 비회원이 즐겨찾기/작성/업로드를 누르면 로그인 UI로 안내. 로그인 후 새 토큰으로 정책 목록 재조회.
  remaining_setup: 이메일 확인 사용 여부, redirect URL, 프로필 초기 닉네임 규칙은 Auth 설정 단계에서 결정.

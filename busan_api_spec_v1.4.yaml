    전용면적 ≤33㎡, null 환산 제외·음수 포함. RPC get_housing_district_medians.
- item: 지도 좌표·출처·갱신시각
  pending: 프로젝트에 검증된 구군 중심좌표·source_name·updated_at 없음. 응답은 null. 확정 후 채움.
- item: 지역 코드
  pending: 법정동/행정동 및 코드 체계 문서화. 지도 API는 거래 테이블 sggCd/sggNm(기장군 포함) 사용.
- item: 컬처/즐길 거리
  pending: 장소·행사 등 대상과 실제 데이터 미제공. 지도 내 즐길 거리 포함, API 필드를 아직 확정하지 않음.
- item: 회원
  pending: Supabase Auth 사용 확정. 모든 회원 기능 이번 구현 포함. 이메일 확인/redirect URL/프로필 초기화 설정은
    연결 단계에서 결정.
- item: DB 매핑
  pending: 현재 ERD/실제 데이터와 아직 대조하지 않음. API 응답 필드와 DB 컬럼은 동일할 필요 없음.
- item: RAG
  pending: 검색 자료, FAQ 문구, 인증 정책 미확정. 실행용 paths에서 제외. 확정 후 security와 401 응답을 결정하여 추가.

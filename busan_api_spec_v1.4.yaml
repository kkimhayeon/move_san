        생략은 전체. 검색과 카테고리는 AND. 토큰 없이 조회하면 is_favorite=false. 유효 토큰 제공 시 해당 사용자의 즐겨찾기를
        필터 결과 안에서 먼저 정렬한 뒤 페이지 분할. 같은 그룹에서는 이름,id 오름차순. 잘못되거나 만료된 토큰은 401. 빈 결과는 200/items=[].
        favorites_only=true면 본인 즐겨찾기만 반환하며 로그인 필수. 검색/카테고리와 AND. 쿼리 boolean은 true/false만
        허용. category는 카테고리 코드이며 응답 category_code와 동일하다. 이 조건은 원래의 즐겨찾기 우선 정렬에 더한 추가
        설계안이다.
